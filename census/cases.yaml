    - file: eval/RESULTS.md
      line: 16
      quote: Precision (genuine defect) | 53 / 53 = **100%**
    independent_check:
    - file: eval/FIELD-REPORT-2.md
      line: 20
      quote: '| findings emitted by auditors | 16 |'
    - file: eval/FIELD-REPORT-2.md
      line: 23
      quote: '| refuted before reporting | 10 |'
    tier: T-C
    who: 'field verdicts: the tool''s own model verifier (FIELD-REPORT-2.md:108, not human-verified)'
    note: null
  - id: fintech-roast-02-upstream-confirmation
    claim: 'The one confirmed finding from the Medusa field run (issue #16012, filed by the author) was
      independently labelled a bug by the upstream maintainers and closed by a third-party pull request
      (#16097) that explicitly cites #16012 and merged 2026-07-22, external to any evidence this repository
