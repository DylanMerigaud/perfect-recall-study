# Census evidence, one entry per included repository (see population.csv for the
# full population and the excluded majority). Each episode pairs a self-generated
# claim with an independent finding, both as exact quotes at a pinned commit,
# re-read from the repository itself at docs/PLAN-PAPER-2026-09-25.md T17, never
# copied from the plan's own draft table. tier is T-A/T-B/T-C per the codebook in
# section 2.4; who names what produced the independent finding. A 'note' field
# records a correction against the plan's draft table when one was found.
# verify.py shallow-clones each repo at its sha and asserts every quote is present
# within 3 lines of its cited line; an 'external' independent_check entry (a live
# fact outside the repository, such as a GitHub issue or PR) is skipped by
# verify.py and left for a human or a live API re-check.

repos:
- repo: dossier-preflight
  sha: 2235d50abf39d0b0e952fedd082672d7003f25b9
  episodes:
  - id: dossier-preflight-01-ink-blind-spot
    claim: The ink sensor retained for required_field held validation.recall 1.0 on the held-out synthetic
      seed (8 of 9 checks in the file read 1.0; forbidden_value is the one exception at 0.9965277777777778,
      line 4606). An independent probe adding real foreign ink to the same field measured 1.000 false
      negatives for that sensor (n=151).
    self_generated:
    - file: grid/results/resume.json
      line: 42
      quote: '"recall": 1.0,'
    independent_check:
    - file: parasitic-ink-probe/FINDING.md
      line: 33
      quote: '| ink (RETAINED by the grid) | **1.000** | [0.975, 1.000] | 151 |'
    tier: T-A
    who: constructed ground truth (the probe knows where it put the ink)
    note: The plan's draft table cited parasitic-ink-probe/results.jsonl for the n=151 figure; that file
      holds only the raw per-reading rows. The aggregated number is stated in FINDING.md. The '8 of 9'
      count is derived by counting the file's 9 top-level checks, not a literal phrase in resume.json.
  - id: dossier-preflight-02-targeted-parasite
    claim: A targeted run laying foreign ink directly on the required_field zone at 1% intensity (level
      0.01) found the ink sensor fired 0 of 81 times, confirming the probe's finding under a second, independent
      synthetic construction.
    self_generated:
    - file: grid/results/resume.json
      line: 42
      quote: '"recall": 1.0,'
    independent_check:
    - file: grid/results/target_parasite.json
      line: 71
      quote: '"fired": 0,'
    tier: T-A
    who: constructed ground truth (the probe knows where it put the ink)
    note: null
- repo: airlock
  sha: 84591f952564fe579586248ab64af8671b434145
  episodes:
  - id: airlock-01-status-hides-brand-miss
    claim: Every gate scored 100% precision and recall on the run's per-gate status table across all 16
      assets (10 real public-domain Prelinger ads plus 6 synthetic assets). Scored apart from that status,
      brand identification on the 10 real spots named the correct brand for only 4 of 10 and named the
      wrong company for 6 of 10, a failure the coarse BLOCK/PASS status hid because the policy blocks
      on any brand the registry does not know.
    self_generated:
    - file: eval/EVAL.md
      line: 41
      quote: '| rights | 16 | 10 | 0 | 6 | 0 | 100% (10 of 10) | 100% (10 of 10) |'
    independent_check:
    - file: eval/EVAL.md
      line: 80
      quote: 'Brand named: 40% (4 of 10).'
    - file: eval/EVAL.md
      line: 124
      quote: Video Intelligence named the wrong company at high confidence
    tier: T-B
    who: hand labels, labeller not named in the repo
    note: 'Correction: the plan''s draft table described the self-generated score as ''100% precision
      and recall on 16 synthetic assets''. EVAL.md line 1 and the per-gate table (n=16) actually cover
      10 real archival ads plus 6 synthetic assets together, not 16 synthetic ones.'
