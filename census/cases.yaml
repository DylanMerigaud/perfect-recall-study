  episodes:
  - id: trimwrit-01-dead-graders
    claim: 'A suite of 32 injection cases was reported by trimwrit run as 32 of 32 resisted. The graders
      behind that score were dead: a YAML/regex escaping bug meant every pattern containing \s matched
      nothing, discovered only by proving the grader could never fire.'
