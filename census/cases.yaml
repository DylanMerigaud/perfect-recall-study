      line: 103
      quote: The second pass reported 32 of 32
    independent_check:
    - file: CHANGELOG.md
      line: 104
      quote: The graders were dead.
    tier: T-A
    who: mechanical proof (a regex grader shown structurally unable to fire)
    note: null
  - id: trimwrit-02-contaminated-baseline
    claim: The three-runs-per-arm ablation for the em-dash case read 1.00 with the rule and 1.00 without
      it (INERT). The 'without' arm had been contaminated by the operator's own global CLAUDE.md, which
      Claude Code loads regardless of working directory; after the runner was fixed to isolate setting
      sources, the same case read 1.00 with the rule and 0.00 without it.
    self_generated:
    - file: README.md
      line: 130
      quote: 0002-no-em-dash-anywhere               1.00      1.00   +0.00  INERT, passes without the
        rule too
    independent_check:
    - file: CHANGELOG.md
      line: 246
      quote: With the fix, the em-dash case scores 1.00 with the rule and 0.00 without it.
    tier: T-A
    who: mechanical proof (the runner's own before/after ablation, re-run after a fix)
    note: null
  - id: trimwrit-03-llm-judge-failure
    claim: Case 0005 scored 1.00 with its rule and 0.67 without it (n=3 per arm); its own LLM judge had
      failed 4 of 4 runs that the mechanical grader passed, until the case was rewritten.
    self_generated:
    - file: README.md
      line: 132
      quote: 0005-decision-last-and-short           1.00      0.67   +0.33  earns its place
    independent_check:
    - file: README.md
      line: 140
      quote: an llm judge that failed four runs out of four
    tier: T-C
    who: an LLM judge (the failing grader) versus a mechanical grader (the one that passed); the disagreement
      is between two automated graders, not a human
    note: null
