      line: 44
      quote: The adversarial pass refuted nothing this run (0 of 53).
    independent_check:
    - external: github.com/medusajs/medusa
      line: null
      quote: 'issue #16012 labelled type: bug, closed; PR #16097 (merged 2026-07-22T17:35:42Z) authored
        by a third party (''Meliceanu''), body reads ''Reported and analyzed in #16012'''
    tier: T-A
    who: third party (medusajs maintainers and an external contributor; verified live via gh api on 2026-09-25,
      not a file at a pinned sha)
    note: This episode's independent_check entry is a live GitHub API fact (issue and PR metadata), not
      a file in the fintech-roast repository; verify.py skips 'external' entries rather than shallow-cloning
      medusajs/medusa.
