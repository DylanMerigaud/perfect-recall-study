    claim: On the planted-bug fixture the auditors reached 30/35 recall and 53/53 genuine-defect precision,
      with the adversarial verifier refuting 0 of 53 findings. A field run on medusajs/medusa at a pinned
      commit produced 16 findings, of which the adversarial pass (a model, not a human) confirmed 4, called
